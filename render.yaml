# Blueprint do Render: New > Blueprint > aponte para este repositório.
# Os dois serviços precisam ficar sempre ligados (plano pago): no plano free
# o serviço dorme, a Evolution desconecta do WhatsApp e os lembretes atrasam.
services:
  - type: web
    name: elpatron-api
    runtime: node
    plan: starter
    region: virginia
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @elpatron/api build
    startCommand: pnpm --filter @elpatron/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_URL
        sync: false
      - key: DEFAULT_TIMEZONE
        value: America/Sao_Paulo
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-opus-5-5
      - key: AI_EFFORT
        value: low
      - key: OPENAI_API_KEY
        sync: false
      - key: TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE
        value: elpatron
      - key: WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false
      - key: SUPPORT_CONTACT
        sync: false

  - type: web
    name: elpatron-evolution
    runtime: image
    image:
      url: docker.io/evoapicloud/evolution-api:latest # fixe uma tag depois de validar
    plan: starter
    region: virginia
    envVars:
      - key: PORT
        value: "8080"
      - key: SERVER_PORT
        value: "8080"
      - key: SERVER_URL
        sync: false # https://elpatron-evolution.onrender.com
      - key: AUTHENTICATION_API_KEY
        sync: false # mesma chave do EVOLUTION_API_KEY da API
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      # Supabase > Connect > Session pooler (porta 5432), com ?schema=evolution no final
      # para as tabelas da Evolution ficarem separadas das do app.
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: evolution
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: ElPatrón
